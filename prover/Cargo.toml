[package]
name = "tornado-prover"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tornado Cash Groth16 prover: upstream zkutil for wasm32 with shared-memory threads"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Upstream zkutil, pinned. default-features = false drops its default bellman
# multicore; we re-enable it below against the rayon-patched bellman.
zkutil = { git = "https://github.com/poma/zkutil", rev = "c1ee8d561ac9850e3a16d331e4e4d219e7638985", default-features = false }
# nolog: bellman's timing logs call std::time::Instant::now(), which panics on
# wasm32-unknown-unknown. multicore: the rayon pool (see patches/).
bellman_ce = { version = "0.3.4", default-features = false, features = ["nolog", "multicore"] }
rayon = "1"
rand = "0.4"

# build.sh fetches pristine crates.io sources into vendor/ and applies patches/.
[patch.crates-io]
bellman_ce = { path = "vendor/bellman_ce" }
clap-v3 = { path = "vendor/clap-v3" }

[profile.release]
lto = true
codegen-units = 1
